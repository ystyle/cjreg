[package]
  cjc-version = "1.2.0"
  name = "cjreg"
  organization = "ystyle"
  description = "仓颉私有中心仓与多仓工具：多仓配置、依赖解析/冲突/版本强制替换、镜像/代理/仓库同步、一键部署"
  version = "0.3.0"
  target-dir = ""
  script-dir = ""
  output-type = "executable"
  compile-option = "--static -Woff unused"
  override-compile-option = ""
  link-option = ""
  include = ["src"]
  license = ["MIT"]
  authors = ["ystyle"]
  repository = "https://atomgit.com/ystyle/cjreg"
  package-configuration = {}

[dependencies]
  "tomlcj" = "1.0.0"
  "semver" = "0.0.3"
  "pbkdf2" = "1.0.0"
  "tang" = "1.0.5"
  "bstorm" = "2.0.1"
  "graph" = "1.0.1"
  "gjson" = "1.2.2"
  # 制品（.cjp = gzip + tar）内的 README / cjpm.toml 提取：tar 用自研 tar-cj（ystyle::tar）
  "ystyle::tar" = "1.1.0"
  "cjxt" = "1.1.0"

# 测试运行的仓颉堆：**每个用例一个内存态 Storm**（Badger 打开即预分配 skiplist Segment，
# 约 17 万个原子对象 + 1.3 MB 连续数组），单测进程累计后在默认堆（256 MB）下会随机触发
# 分配失败 —— 症状是**全量跑间歇失败、单独跑全绿**，且失败用例每次都不一样
# （实测：默认堆连跑 3 次全挂、换 8GB 连跑 2 次全绿，见 docs/verification.md §4.7）。
# 这里把测试进程的堆固定调大，让 `cjpm test` 的开箱行为就是稳定的。
[profile.test.env]
cjHeapSize = { value = "8GB", splice-type = "replace" }
cjGCThreshold = { value = "4GB", splice-type = "replace" }

# badger-cj（bstorm 底层）的 io_uring 支持
[target.x86_64-unknown-linux-gnu]
  link-option = "-luring"
[target.aarch64-unknown-linux-gnu]
  link-option = "-luring"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-w64-mingw32.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
